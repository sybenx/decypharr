# Fork-only: builds the image xumbrel runs until the fix is merged upstream.
name: Fork image

on:
  push:
    branches: [xumbrel]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --abbrev=0)+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            CHANNEL=stable
          tags: |
            ghcr.io/${{ github.repository_owner }}/decypharr:sha-${{ steps.v.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/decypharr:xumbrel
          cache-from: type=gha
          cache-to: type=gha,mode=max
